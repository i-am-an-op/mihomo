name: Review upstream stable updates
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  prepare-review:
    if: github.repository == 'i-am-an-op/mihomo' && github.ref == 'refs/heads/dns-maintained'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Prepare a stable-update pull request without executing fetched code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 downstream/sync_upstream.py
