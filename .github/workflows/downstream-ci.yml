name: Downstream CI
on:
  push:
    branches: [dns-maintained]
  pull_request:
    branches: [dns-maintained]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dns-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      SKIP_INTEROP_TEST: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: false
      - name: Upstream synchronization failure and recovery fixtures
        run: python3 downstream/sync_test.py
      - name: Verify dependencies
        run: go mod download && go mod verify
      - name: Upstream tests with retained gVisor support
        # The inherited inbound transport matrix can exceed five minutes on ARM.
        # Match Go's default budget used by upstream; retain every test.
        run: go test -tags with_gvisor -timeout 10m ./...
      - name: DNS and configuration race tests
        run: go test -race -tags with_gvisor ./dns ./config ./hub/executor
      - name: Reproducible native build and module inventory
        run: python3 downstream/package.py
      - name: Wire regressions against the actual binary
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes --only-binary=:all: -r downstream/requirements.txt
          .venv/bin/python downstream/protocol_test.py --mihomo "dist/mihomo-linux-$ARCH" --disable-cache --expect-fixed --output protocol-results.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: candidate-${{ matrix.arch }}
          path: |
            dist/
            protocol-results.json
          retention-days: 30
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: false
      - name: Reachability-aware vulnerability check
        env:
          GOTOOLCHAIN: local
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags with_gvisor -json ./... > govulncheck.json
          python3 downstream/vulnerability_gate.py govulncheck.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: vulnerability-evidence
          path: govulncheck.json
          retention-days: 30
